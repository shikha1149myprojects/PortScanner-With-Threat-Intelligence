<!doctype html>
<html lang="en">
<head>
    <title>Port & Threat Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">
    <h1 class="text-center mb-4">🔎 Port & Threat Scanner</h1>
    <form method="post" class="p-4 rounded bg-secondary">
        <div class="mb-3">
            <label for="target_ip" class="form-label">Enter Target IP:</label>
            <input type="text" class="form-control" id="target_ip" name="target_ip" placeholder="e.g., 192.168.1.1" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Scan</button>
        </div>
    </form>
</div>

</body>
</html>
